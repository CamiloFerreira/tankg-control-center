name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # older glibc: the binary runs on more distributions
            asset: TankG-linux-x86_64
            binary: dist/TankG
          - os: windows-latest
            asset: TankG-windows-x64.exe
            binary: dist/TankG.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libxkbcommon0
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m pytest -q
      - run: python packaging/build.py
      - name: Smoke test (CLI help)
        run: ${{ matrix.binary }} list --help
      - name: Sign (Windows, self-signed certificate)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Host "No signing secrets: publishing unsigned"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:PFX_PASSWORD, $flags)
          $sig = Set-AuthenticodeSignature -FilePath "${{ matrix.binary }}" -Certificate $cert `
                   -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
          Remove-Item $pfx
          # Self-signed: status is "UnknownError" (untrusted root) but the signature is present.
          if (-not $sig.SignerCertificate) { throw "Signing failed: $($sig.StatusMessage)" }
          Write-Host "Signed by $($sig.SignerCertificate.Subject), thumbprint $($sig.SignerCertificate.Thumbprint)"
      - name: Rename
        shell: bash
        run: mv "${{ matrix.binary }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
        run: |
          chmod +x assets/TankG-linux-x86_64
          cp packaging/RELEASE_NOTES.md notes.md
          if [ "$SIGNED" = "true" ]; then
            cp packaging/tankg-codesign.cer assets/
            cat >> notes.md <<'NOTES'

          ## Firma (Windows)

          El `.exe` está firmado con un certificado **autofirmado** («Camilo Ferreira (Tank-G Control Center)»).
          Para que tus equipos lo reconozcan instala `tankg-codesign.cer` (README, «Firma y verificación»);
          en otros PCs se comporta como un ejecutable sin firmar.
          NOTES
          else
            cat >> notes.md <<'NOTES'

          ## Firma

          Esta versión **no está firmada**: Windows SmartScreen puede avisar («Más información» → «Ejecutar
          de todas formas»). Comprueba la descarga con `SHA256SUMS`.
          NOTES
          fi
          sed -i 's/^          //' notes.md
          (cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Tank-G Control Center $GITHUB_REF_NAME" \
            --notes-file notes.md
